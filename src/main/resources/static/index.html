<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Analytics Kafka Streams</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/smoothie/1.34.0/smoothie.min.js"></script>
</head>
<body>
<h2>Real-Time Page Analytics (Kafka Streams)</h2>
<canvas id="chart2" width="700" height="350"></canvas>
<script>
  var index = -1;
  var colors = [
    { stroke: 'rgba(0, 255, 0, 1)', fill: 'rgba(0, 255, 0, 0.2)' },
    { stroke: 'rgba(255, 0, 0, 1)', fill: 'rgba(255, 0, 0, 0.2)' }
  ];
  var courbe = [];
  var smoothieChart = new SmoothieChart({ tooltip: true });
  smoothieChart.streamTo(document.getElementById("chart2"), 500);

  var stockEventSource = new EventSource("/analytics");
  stockEventSource.addEventListener("message", function (event) {
    var val = JSON.parse(event.data);
    for (var key in val) {
      if (!courbe[key]) {
        courbe[key] = new TimeSeries();
        index++;
        var color = colors[index % colors.length];
        smoothieChart.addTimeSeries(courbe[key], {
          strokeStyle: color.stroke,
          fillStyle: color.fill,
          lineWidth: 2
        });
      }
      courbe[key].append(new Date().getTime(), val[key]);
    }
  });
</script>
</body>
</html>
